name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# wire-mvc is proposal-native and swift-tools-version 6.4: it depends on the swift-http-api-proposal
# stack and swift-syntax's 604 line, so it builds only on a Swift 6.4 toolchain. Every job that needs a
# toolchain installs the one named in `.swift-version` through swift-wire/setup-swift — a release today,
# but the same mechanism carries a pre-release snapshot when the package moves ahead of the released
# Swift again.
jobs:
  # Two packages: the framework (this directory) and its runnable fixtures (Fixtures/). The split exists so
  # the framework's manifest names no concrete HTTP server — see the resolution guard below.
  BuildAndRun:
    name: Swift 6.4 (pinned)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
      - name: Build
        run: swift build
      - name: Verify the core graph resolves no concrete server
        # The point of the `NIOHTTPServer` trait: with it off, every `swift-http-server` product dependency
        # is gated, so SwiftPM prunes the package outright and a framework-agnostic consumer of `WireMVC`
        # resolves no server. This is a regression guard on that — an ungated reference anywhere in the
        # manifest would silently put the NIO server back into every downstream `Package.resolved`.
        run: |
          swift package resolve
          if grep -q '"identity" : "swift-http-server"' Package.resolved; then
            echo "swift-http-server is back in the core graph — a swift-http-server product dependency is not trait-gated"
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Test ServerTransport adapter (trait)
        # The opt-in WireMVCServerTransport adapter is behind the `ServerTransport` trait (which pulls
        # in OpenAPIRuntime); enable it to build the adapter + run its test. The steps above leave the
        # trait off, so the core never resolves OpenAPIRuntime.
        run: |
          set -o pipefail
          swift test --traits ServerTransport 2>&1 | tee /tmp/servertransport.log
          # `AdapterTests.swift` is *entirely* `#if ServerTransport`, so if that gate ever stops matching
          # — trait renamed, define not reaching the target — the file compiles to zero tests and this
          # step still passes: "Test run with 0 tests in 0 suites passed" is a pass, not a failure. The
          # adapter would then be wholly untested behind a green tick. Assert the suite actually ran.
          # This is the sibling of the `Package.resolved` guard above: both catch a trait going quiet.
          grep -q 'Suite "WireMVCServerTransport" passed' /tmp/servertransport.log || {
            echo "the ServerTransport adapter suite did not run — is the '#if ServerTransport' gate in AdapterTests.swift intact?"
            exit 1
          }
      - name: Build fixtures
        # The runnable examples and the integration suites live in their own package (Fixtures/) because
        # they serve on NIOHTTPServer: anything naming swift-http-server unconditionally in wire-mvc's
        # manifest would defeat the trait. They enable it on their path dependency.
        working-directory: Fixtures
        run: swift build
      - name: Test fixtures
        working-directory: Fixtures
        run: swift test
      - name: Run end-to-end example
        # @Controller generates the RouteContributor witnesses; Wire collates them; WireMVC.router
        # turns them into NIOHTTPServer's request handler and the example drives every route over
        # real HTTP on an ephemeral loopback port. Prints "wire-mvc example OK" or exits non-zero.
        working-directory: Fixtures
        run: swift run WireMVCExample
      - name: Run @WireMVCBootstrap example (boot, probe, stop)
        # The generated @main serves indefinitely, so — unlike WireMVCExample — it can't run to
        # completion. Boot it, poll until it binds, assert one route's response, then stop it. Validates
        # that the generated composition-root @main bootstraps the graph, constructs AppBootstrap, and
        # serves the collated HelloController on the WireMVCRouter trie.
        working-directory: Fixtures
        run: |
          BIN="$(swift build --show-bin-path)/WireMVCBootstrapExample"
          # Line-buffer stdout so the global middleware's `access:` prints reach the log as each request is
          # handled (block-buffered stdout to a file wouldn't flush before the server is killed).
          stdbuf -oL "$BIN" > serverlog.txt 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/hello/ci -o resp.json; then ok=1; break; fi
            sleep 1
          done
          # /hello/tenant throws an unmapped-locally error → the Bootstrap's global @ErrorResponse
          # The Bootstrap's global @ErrorResponse tier maps it to 400. -o /dev/null since curl -f already fails on non-2xx.
          tenant=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/hello/tenant)
          # An unmatched path → the @NotFound fallback: a custom 404 with "no route here".
          notfound=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/nope)
          # mountIntrospectionAt() → the graph's wiring model as JSON at /wiring.
          wiring=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/wiring)
          kill "$pid" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "WireMVCBootstrapExample did not bind"; exit 1; }
          cat resp.json; echo
          grep -q '"message":"Hello, ci!"' resp.json
          echo "GET /hello/tenant → $tenant (expect 400, global @ErrorResponse)"
          [ "$tenant" = 400 ] || { echo "global @ErrorResponse tier did not map to 400"; exit 1; }
          echo "GET /nope → $notfound (expect the @NotFound fallback: 404 + 'no route here')"
          case "$notfound" in *"no route here"*"[404]") ;; *) echo "@NotFound fallback did not fire"; exit 1;; esac
          echo "GET /wiring → $wiring (expect 200 + the introspection model, mountIntrospectionAt)"
          case "$wiring" in *'"bindings"'*"[200]") ;; *) echo "mountIntrospectionAt did not serve /wiring"; exit 1;; esac
          # The global @Middleware (the AccessLog factory) folds around EVERY request via the
          # generated global-middleware proxy's wrapGlobalMiddleware — matched routes and the @NotFound miss
          # alike. Its `access:` line must appear for both a matched route and the miss.
          echo "=== server log ==="; grep -E '^access:|^introspection-guard:' serverlog.txt || true
          grep -q '^access: GET /hello/ci' serverlog.txt || { echo "global @Middleware did not run on a matched route"; exit 1; }
          grep -q '^access: GET /nope' serverlog.txt || { echo "global @Middleware did not run on the miss"; exit 1; }
          # The introspection guard (route-scoped @Middleware on mountIntrospectionAt) folds around /wiring
          # ONLY — it must fire for /wiring but not for a plain route.
          grep -q '^introspection-guard: /wiring' serverlog.txt || { echo "introspection guard did not run on /wiring"; exit 1; }
          grep -q '^introspection-guard: /hello' serverlog.txt && { echo "introspection guard leaked onto a non-introspection route"; exit 1; } || true

  SwiftFormat:
    name: swift-format (6.4 toolchain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
      - name: Run swift-format
        # From the 6.4 toolchain so it parses the proposal's ~Copyable / consuming sending syntax
        # (a released swift-format can't).
        run: swift-format format --recursive --in-place .
      - name: Check for formatting differences
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code

  SwiftLint:
    name: SwiftLint 0.63.2
    # `swiftlint lint` is SwiftSyntax-based and parses the 6.4 sources fine, so it needs no toolchain
    # and runs on a plain runner. (The `unused_import` *analyzer* rule is not run: it drives SourceKit
    # against the compiler build log, whose 6.4-only flags this SwiftLint's SourceKit rejects — on 6.4
    # the compiler's own InternalImportsByDefault emits unused-import warnings natively instead.)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        # The prebuilt Linux binary needs the GLIBC on ubuntu-24.04+.
        run: |
          curl -sL https://github.com/realm/SwiftLint/releases/download/0.63.2/swiftlint_linux_amd64.zip -o swiftlint.zip
          unzip -o swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
      - name: SwiftLint
        run: swiftlint lint --quiet

  Documentation:
    name: Documentation (DocC gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
      - name: Build documentation, failing on any diagnostic in this package's own sources
        # The catalog's articles reference symbols by name, and so do the doc comments on the API
        # itself, so a renamed or removed declaration breaks a link rather than a build — silently,
        # and only for a reader. This is what makes them a gate rather than prose.
        #
        # `--warnings-as-errors` cannot be used directly: `WireMVC` re-exports `AsyncStreaming`
        # through a `public import`, and on Linux the symbol graph carries those types into
        # `/WireMVC/…`, so DocC reports unresolved links in *their* doc comments. `Scripts/docc-gate.py`
        # filters the structured diagnostics down to files in this repository instead.
        run: |
          swift package generate-documentation --target WireMVC \
            --diagnostics-file "$RUNNER_TEMP/docc.json"
          python3 Scripts/docc-gate.py "$RUNNER_TEMP/docc.json"

  SwiftSyntaxMatrix:
    name: swift-syntax ${{ matrix.swift-syntax-major }}.x / Swift (pinned)
    # The declared range admits one major today (604..<605), so this coincides with the build above;
    # it is the job that grows an entry when the range does, and until then it is the one place the
    # range string is asserted rather than assumed.
    strategy:
      fail-fast: false
      matrix:
        swift-syntax-major: ["604"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
      - name: Pin swift-syntax to ${{ matrix.swift-syntax-major }}.x
        # Narrow the declared range to a single major so SPM resolves to the matrix's swift-syntax
        # version. Targets the exact range string in Package.swift; if that string changes the sed
        # needs to follow — and `grep` fails the step if it no longer matched anything.
        run: |
          next=$((${{ matrix.swift-syntax-major }} + 1))
          sed -i 's|"604.0.0"..<"605.0.0"|"${{ matrix.swift-syntax-major }}.0.0"..<"'${next}'.0.0"|' Package.swift
          grep -q '"${{ matrix.swift-syntax-major }}.0.0"..<"'${next}'.0.0"' Package.swift
          grep swift-syntax Package.swift
      - name: Resolve dependencies
        # Only swift-syntax moves: the narrowed range can exclude the committed pin, so it has to be
        # re-resolved, but every other dependency stays at its Package.resolved pin. A bare
        # `swift package update` re-resolves the whole graph, which made this the one job building
        # against unpinned upstreams, so an upstream release broke it on changes that touched no Swift.
        run: swift package update swift-syntax
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test

  StaticLinuxSDK:
    name: Static Linux SDK (cross-compile to aarch64-musl)
    runs-on: ubuntu-24.04
    # The image and the SDK bundle must be the same Swift release: an SDK only installs against the
    # toolchain it was built for, so these two literals move together — and together with
    # `.swift-version`, since the cross-compile should check the toolchain the package is developed on.
    container:
      image: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install Static Linux SDK
        run: swift sdk install https://download.swift.org/swift-6.4.0-release/static-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz --checksum 47d2fd89eebfdf9eb4d536b6710414297f755c17926cdebc4742c08982b40a9e
      - name: Cross-compile the shipping products for ARM64 Linux
        # Product by product rather than a whole-package `swift build`, because the package also holds
        # `WireMVCTesting`, which imports swift-testing — and the static SDK ships no `Testing` module,
        # so a whole-package build dies there with "no such module 'Testing'" whatever the rest does.
        # These five are the default-trait libraries a consumer links; the trait-gated adapters
        # (`WireMVCServerTransport`, `WireMVCElementary`) are not cross-compiled here.
        #
        # The fixtures are not cross-compiled either: they serve on NIOHTTPServer, and swift-http-server
        # (at the revision `Fixtures/Package.resolved` pins) does not compile for the musl target on
        # 6.4.0 — `NIOHTTPServer+HTTP1_1.swift` fails region isolation ("sending 'iterator' risks
        # causing data races") for aarch64-swift-linux-musl while building for glibc and macOS. That is
        # upstream's to fix; when it is, `Fixtures/` is the deployable shape to add back.
        run: |
          for product in WireMVC WireMVCRouter WireMVCMiddleware WireMVCLogging WireMVCTaskLocalLogging; do
            swift build -c release --swift-sdk aarch64-swift-linux-musl --product "$product"
          done

  Coverage:
    name: Coverage / Swift (pinned)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
      - name: Run tests with coverage
        # The framework package's own suite. The fixtures' integration suites serve on NIOHTTPServer and
        # exercise generated code, not the framework's sources, so they add noise to a coverage figure
        # rather than signal.
        run: swift test --enable-code-coverage --xunit-output test-results.xml
      - name: Convert to LCOV
        # 6.4's build system emits one `<Target>-test-runner` executable and a `<Target>.so` per test
        # module rather than the single `.xctest` binary earlier toolchains linked. Every one of them
        # carries instrumented code, so llvm-cov is handed all of them; the `.xctest` glob keeps the
        # older layout working should a job ever run on one.
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name 'default.profdata' -path '*/codecov/*' | head -1)
          objects=()
          for f in "$BIN_PATH"/*-test-runner "$BIN_PATH"/*.so "$BIN_PATH"/*.xctest; do
            [ -f "$f" ] && objects+=(-object "$f")
          done
          llvm-cov export \
            -format=lcov \
            -instr-profile="$PROFDATA" \
            "${objects[@]}" \
            -ignore-filename-regex=".build|Tests" \
            > coverage.lcov
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: coverage.lcov
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: test-results.xml
          report_type: test_results
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  LicenceHeaders:
    name: Licence headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Pure git and shell, so this gate needs no toolchain and answers in seconds. It is a
      # separate job rather than a step on an existing one because a missing header is not a
      # build error: nothing else in the toolchain looks, so without this the omission is silent.
      - name: Check SPDX headers
        run: ./Scripts/check-license-headers.sh

  Specifications:
    name: Specifications
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # `openspec/specs/` states what the code does, one requirement at a time, each ending with the
      # test that measures it; `openspec/changes/` holds the spec deltas of proposals not yet
      # implemented. Three checks keep that honest, and none needs a toolchain. The OpenSpec
      # validator checks the format of both; the version is pinned so a CLI release cannot change
      # what passes. `spec-pins-gate.py` checks that every pinned path exists and every pinned test,
      # golden case or job name occurs in the file named, because a renamed test otherwise leaves a
      # requirement claiming a measurement nobody takes. `spec-deltas-gate.py` applies every active
      # change to a scratch copy, because the validator passes a MODIFIED heading that names no
      # requirement and only applying the delta finds it.
      - name: Validate the specifications and proposed changes
        run: npx -y @fission-ai/openspec@1.13.2 validate --all --strict --no-interactive
        env:
          OPENSPEC_TELEMETRY: "0"
      - name: Check every pinned test exists
        run: python3 Scripts/spec-pins-gate.py
      - name: Check every proposed change applies
        run: python3 Scripts/spec-deltas-gate.py
