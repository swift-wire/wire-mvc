name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# wire-mvc is proposal-native and swift-tools-version 6.4: it depends on the swift-http-api-proposal
# stack and swift-syntax's pre-release 604 line, so it builds only on a Swift 6.4 toolchain — the build/format jobs run on the nightly 6.4 container, since
# SwiftyLab/setup-swift installs released toolchains only. swift-syntax 604 is pinned via its
# release/6.4.x branch in Package.swift (SPM version ranges don't resolve pre-release tags; the
# branch pin also overrides swift-wire's transitive 603 requirement).
jobs:
  # Two packages: the framework (this directory) and its runnable fixtures (Fixtures/). The split exists so
  # the framework's manifest names no concrete HTTP server — see the resolution guard below.
  BuildAndRun:
    name: Swift 6.4 (pinned)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read the pinned toolchain
        # `.swift-version` is the single source of truth: local `swiftly` and CI resolve the same snapshot,
        # so a green CI and a broken working copy cannot disagree about which compiler they meant. Bump the
        # file, not the workflow.
        run: echo "SWIFT_SNAPSHOT=$(cat .swift-version)" >> "$GITHUB_ENV"
      - name: Install system dependencies
        # libcurl4-openssl-dev is required by the toolchain itself (Foundation networking on Linux) and must
        # precede the install, or Swiftly's post-install check fails. curl also probes the
        # @WireMVCBootstrap example's server.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev libcurl4-openssl-dev curl
      - name: Install Swiftly + the pinned toolchain
        run: |
          curl -L "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" | tar zxf -
          ./swiftly init --assume-yes --skip-install
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          # No `--use`: every command below runs through `swiftly run`, which reads `.swift-version` itself.
          # `--use` would *rewrite* that file (dropping its trailing newline) and dirty the tree, which
          # the swift-format job's `git diff --exit-code` guard then fails on.
          "$HOME/.local/share/swiftly/bin/swiftly" install "$SWIFT_SNAPSHOT" --assume-yes
      - name: Build
        run: swiftly run swift build
      - name: Verify the core graph resolves no concrete server
        # The point of the `NIOHTTPServer` trait: with it off, every `swift-http-server` product dependency
        # is gated, so SwiftPM prunes the package outright and a framework-agnostic consumer of `WireMVC`
        # resolves no server. This is a regression guard on that — an ungated reference anywhere in the
        # manifest would silently put the NIO server back into every downstream `Package.resolved`.
        run: |
          swiftly run swift package resolve
          if grep -q '"identity" : "swift-http-server"' Package.resolved; then
            echo "swift-http-server is back in the core graph — a swift-http-server product dependency is not trait-gated"
            exit 1
          fi
      - name: Test
        run: swiftly run swift test
      - name: Test ServerTransport adapter (trait)
        # The opt-in WireMVCServerTransport adapter is behind the `ServerTransport` trait (which pulls
        # in OpenAPIRuntime); enable it to build the adapter + run its test. The steps above leave the
        # trait off, so the core never resolves OpenAPIRuntime.
        run: |
          set -o pipefail
          swiftly run swift test --traits ServerTransport 2>&1 | tee /tmp/servertransport.log
          # `AdapterTests.swift` is *entirely* `#if ServerTransport`, so if that gate ever stops matching
          # — trait renamed, define not reaching the target — the file compiles to zero tests and this
          # step still passes: "Test run with 0 tests in 0 suites passed" is a pass, not a failure. The
          # adapter would then be wholly untested behind a green tick. Assert the suite actually ran.
          # This is the sibling of the `Package.resolved` guard above: both catch a trait going quiet.
          grep -q 'Suite "WireMVCServerTransport" passed' /tmp/servertransport.log || {
            echo "the ServerTransport adapter suite did not run — is the '#if ServerTransport' gate in AdapterTests.swift intact?"
            exit 1
          }
      - name: Build fixtures
        # The runnable examples and the integration suites live in their own package (Fixtures/) because
        # they serve on NIOHTTPServer: anything naming swift-http-server unconditionally in wire-mvc's
        # manifest would defeat the trait. They enable it on their path dependency.
        working-directory: Fixtures
        run: swiftly run swift build
      - name: Test fixtures
        working-directory: Fixtures
        run: swiftly run swift test
      - name: Run end-to-end example
        # @Controller generates the RouteContributor witnesses; Wire collates them; WireMVC.router
        # turns them into NIOHTTPServer's request handler and the example drives every route over
        # real HTTP on an ephemeral loopback port. Prints "wire-mvc example OK" or exits non-zero.
        working-directory: Fixtures
        run: swiftly run swift run WireMVCExample
      - name: Run @WireMVCBootstrap example (boot, probe, stop)
        # The generated @main serves indefinitely, so — unlike WireMVCExample — it can't run to
        # completion. Boot it, poll until it binds, assert one route's response, then stop it. Validates
        # that the generated composition-root @main bootstraps the graph, constructs AppBootstrap, and
        # serves the collated HelloController on the WireMVCRouter trie.
        working-directory: Fixtures
        run: |
          BIN="$(swift build --show-bin-path)/WireMVCBootstrapExample"
          # Line-buffer stdout so the global middleware's `access:` prints reach the log as each request is
          # handled (block-buffered stdout to a file wouldn't flush before the server is killed).
          stdbuf -oL "$BIN" > serverlog.txt 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/hello/ci -o resp.json; then ok=1; break; fi
            sleep 1
          done
          # /hello/tenant throws an unmapped-locally error → the Bootstrap's global @ErrorResponse
          # The Bootstrap's global @ErrorResponse tier maps it to 400. -o /dev/null since curl -f already fails on non-2xx.
          tenant=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/hello/tenant)
          # An unmatched path → the @NotFound fallback: a custom 404 with "no route here".
          notfound=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/nope)
          # mountIntrospectionAt() → the graph's wiring model as JSON at /wiring.
          wiring=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/wiring)
          kill "$pid" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "WireMVCBootstrapExample did not bind"; exit 1; }
          cat resp.json; echo
          grep -q '"message":"Hello, ci!"' resp.json
          echo "GET /hello/tenant → $tenant (expect 400, global @ErrorResponse)"
          [ "$tenant" = 400 ] || { echo "global @ErrorResponse tier did not map to 400"; exit 1; }
          echo "GET /nope → $notfound (expect the @NotFound fallback: 404 + 'no route here')"
          case "$notfound" in *"no route here"*"[404]") ;; *) echo "@NotFound fallback did not fire"; exit 1;; esac
          echo "GET /wiring → $wiring (expect 200 + the introspection model, mountIntrospectionAt)"
          case "$wiring" in *'"bindings"'*"[200]") ;; *) echo "mountIntrospectionAt did not serve /wiring"; exit 1;; esac
          # The global @Middleware (the AccessLog factory) folds around EVERY request via the
          # generated global-middleware proxy's wrapGlobalMiddleware — matched routes and the @NotFound miss
          # alike. Its `access:` line must appear for both a matched route and the miss.
          echo "=== server log ==="; grep -E '^access:|^introspection-guard:' serverlog.txt || true
          grep -q '^access: GET /hello/ci' serverlog.txt || { echo "global @Middleware did not run on a matched route"; exit 1; }
          grep -q '^access: GET /nope' serverlog.txt || { echo "global @Middleware did not run on the miss"; exit 1; }
          # The introspection guard (route-scoped @Middleware on mountIntrospectionAt) folds around /wiring
          # ONLY — it must fire for /wiring but not for a plain route.
          grep -q '^introspection-guard: /wiring' serverlog.txt || { echo "introspection guard did not run on /wiring"; exit 1; }
          grep -q '^introspection-guard: /hello' serverlog.txt && { echo "introspection guard leaked onto a non-introspection route"; exit 1; } || true

  SwiftFormat:
    name: swift-format (6.4 toolchain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read the pinned toolchain
        # `.swift-version` is the single source of truth: local `swiftly` and CI resolve the same snapshot,
        # so a green CI and a broken working copy cannot disagree about which compiler they meant. Bump the
        # file, not the workflow.
        run: echo "SWIFT_SNAPSHOT=$(cat .swift-version)" >> "$GITHUB_ENV"
      - name: Install system dependencies
        # libcurl4-openssl-dev is required by the toolchain itself (Foundation networking on Linux) and must
        # precede the install, or Swiftly's post-install check fails. curl also probes the
        # @WireMVCBootstrap example's server.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev libcurl4-openssl-dev curl
      - name: Install Swiftly + the pinned toolchain
        run: |
          curl -L "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" | tar zxf -
          ./swiftly init --assume-yes --skip-install
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          # No `--use`: every command below runs through `swiftly run`, which reads `.swift-version` itself.
          # `--use` would *rewrite* that file (dropping its trailing newline) and dirty the tree, which
          # the swift-format job's `git diff --exit-code` guard then fails on.
          "$HOME/.local/share/swiftly/bin/swiftly" install "$SWIFT_SNAPSHOT" --assume-yes
      - name: Run swift-format
        # From the 6.4 toolchain so it parses the proposal's ~Copyable / consuming sending syntax
        # (a released swift-format can't).
        run: swiftly run swift-format format --recursive --in-place .
      - name: Check for formatting differences
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code

  SwiftLint:
    name: SwiftLint 0.63.2
    # `swiftlint lint` is SwiftSyntax-based and parses the 6.4 sources fine, so it needs no toolchain
    # and runs on a plain runner. (The `unused_import` *analyzer* rule is not run: it drives SourceKit
    # against the compiler build log, whose 6.4-only flags this SwiftLint's SourceKit rejects — on 6.4
    # the compiler's own InternalImportsByDefault emits unused-import warnings natively instead.)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        # The prebuilt Linux binary needs the GLIBC on ubuntu-24.04+.
        run: |
          curl -sL https://github.com/realm/SwiftLint/releases/download/0.63.2/swiftlint_linux_amd64.zip -o swiftlint.zip
          unzip -o swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
      - name: SwiftLint
        run: swiftlint lint --quiet

  Documentation:
    name: Documentation (DocC gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read the pinned toolchain
        run: echo "SWIFT_SNAPSHOT=$(cat .swift-version)" >> "$GITHUB_ENV"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev libcurl4-openssl-dev
      - name: Install Swiftly + the pinned toolchain
        run: |
          curl -L "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" | tar zxf -
          ./swiftly init --assume-yes --skip-install
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          # No `--use`: the command below runs through `swiftly run`, which reads `.swift-version`
          # itself. `--use` would rewrite that file and dirty the tree, which the swift-format job's
          # `git diff --exit-code` guard then fails on.
          "$HOME/.local/share/swiftly/bin/swiftly" install "$SWIFT_SNAPSHOT" --assume-yes
      - name: Build documentation, failing on any diagnostic in this package's own sources
        # The catalog's articles reference symbols by name, and so do the doc comments on the API
        # itself, so a renamed or removed declaration breaks a link rather than a build — silently,
        # and only for a reader. This is what makes them a gate rather than prose.
        #
        # `--warnings-as-errors` cannot be used directly: `WireMVC` re-exports `AsyncStreaming`
        # through a `public import`, and on Linux the symbol graph carries those types into
        # `/WireMVC/…`, so DocC reports unresolved links in *their* doc comments. `Scripts/docc-gate.py`
        # filters the structured diagnostics down to files in this repository instead.
        run: |
          swiftly run swift package generate-documentation --target WireMVC \
            --diagnostics-file "$RUNNER_TEMP/docc.json"
          python3 Scripts/docc-gate.py "$RUNNER_TEMP/docc.json"
